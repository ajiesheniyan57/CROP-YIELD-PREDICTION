version: '3.8'

services:
  agriyield-app:
    build:
      context: .
      dockerfile: Dockerfile
    image: agriyield-ai:latest
    container_name: agriyield_dashboard
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - HOST=0.0.0.0
      - FLASK_ENV=production
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
